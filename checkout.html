<body class="bg-surface text-on-surface font-body-md antialiased md:bg-surface-container-low min-h-screen flex flex-col items-center">
<!-- Top App Bar (From Shared Components) -->
<header class="bg-surface dark:bg-surface fixed top-0 w-full z-50 flex justify-between items-center px-sm h-16 max-w-full md:max-w-[container-max] mx-auto md:bg-surface md:shadow-sm md:rounded-b-lg">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low transition-colors p-2 rounded-full active:opacity-70 transition-all">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md uppercase tracking-widest text-primary dark:text-primary-fixed-dim font-extrabold">MAITÉ</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas (Mobile optimized, centering on desktop) -->
<main class="w-full max-w-md mx-auto pt-24 pb-32 px-5 flex flex-col gap-8 bg-surface md:my-10 md:rounded-xl md:shadow-[0_8px_30px_rgb(74,55,40,0.08)] md:border md:border-outline-variant/20 md:p-8">
<!-- Header -->
<div class="text-center">
<h2 class="font-headline-md text-headline-md text-primary mb-2">Tu Pedido</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Revisa tu selección antes de confirmar.</p>
</div>
<!-- Order Summary Items -->
<section class="flex flex-col gap-4">
<!-- Item 1 -->
<div class="flex items-center justify-between border-b border-outline-variant/30 pb-4">
<div class="flex items-center gap-4">
<div class="w-16 h-16 rounded-DEFAULT overflow-hidden bg-surface-container-high flex-shrink-0">
<img alt="Baguette Tradicional" class="w-full h-full object-cover" data-alt="A close up, high-end bakery style photograph of a rustic, crusty traditional French baguette. The bread is placed on a pristine white marble surface, illuminated by soft, natural morning sunlight streaming from an off-camera window. Minimalist styling, focusing on the texture of the deep golden-brown crust. Soft focus background, warm cream and wheat tones. Professional food photography." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8IlbJZ5wqI-WtA3bJbz5IReqMhIlyQTpeXqPWkP2-jpUW1kME5ke7oEqmg61iK6I5Y9W4rsxe8O4KGBMFnvWLNSwyHQf1TmO2FxUl1V5yKatAMExEXAhm5pDOrk1uPgAcMsmjXBc4yPT2yNTYHeKHIRVgYSHTlGTdI6rrMvDZ2E9ARUb-rn7rnCbdUvOdTNGpnDrcHBYFVKQHj-5l6oHeZedKiYF_fJJnbssRzyVhqxqugP3fXdU_Q9CK_w-03MSP3o7K9SsCp10"/>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface">Baguette Tradicional</h3>
<p class="font-caption text-caption text-on-surface-variant mt-1">1 x $1.200</p>
</div>
</div>
<div class="font-body-md text-body-md text-primary font-medium">
                    $1.200
                </div>
</div>
<!-- Item 2 -->
<div class="flex items-center justify-between border-b border-outline-variant/30 pb-4">
<div class="flex items-center gap-4">
<div class="w-16 h-16 rounded-DEFAULT overflow-hidden bg-surface-container-high flex-shrink-0">
<img alt="Masa Madre Silvestre" class="w-full h-full object-cover" data-alt="An artisanal sourdough bread loaf, heavily scored with a beautiful pattern, resting on a rustic wooden cutting board against a warm cream background. The crust is a deep, rich brown (crust brown) with flour dusted on top. The lighting is soft, diffused, and cinematic, highlighting the organic texture and authentic craftsmanship of the bread. Minimalist and luxurious bakery aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrA2rXdTRZWRmNiwJA0A-CW_EUgdlvdRAOwcv-jkfVMC2a5R8trqAzKRmeRBfdCEVmg-gg6Hi6MoGIDU_i2Ih28OHfi1l9evDS6WK2FKDdgi5V86fHpWvnR_igB9AvSWtKNie9DpTEPsbXe4ykN20nQ3V-jcGB5jABBsFZ5kdLLjC8FXYOV04HbxZ5x6O9V2rbm1wgvg394QKwkkFX0-OaMYyNr3m8_aFs0m6-ejF8vD4Dl9xidRtJkvkAs3Iuv0PVNuMRDwRIlvo"/>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface">Masa Madre Silvestre</h3>
<p class="font-caption text-caption text-on-surface-variant mt-1">1 x $3.500</p>
</div>
</div>
<div class="font-body-md text-body-md text-primary font-medium">
                    $3.500
                </div>
</div>
</section>
<!-- Delivery Method Selection -->
<section class="flex flex-col gap-3">
<h3 class="font-label-md text-label-md text-on-surface uppercase tracking-widest mb-1">Método de Entrega</h3>
<div class="grid grid-cols-2 gap-3">
<!-- Option 1: Pickup (Selected) -->
<label class="relative flex flex-col items-center p-4 rounded-lg border-2 border-secondary-fixed-dim bg-secondary-fixed-dim/10 cursor-pointer transition-all">
<input checked="" class="sr-only" name="delivery" type="radio" value="pickup"/>
<span class="material-symbols-outlined text-primary mb-2" data-icon="storefront">storefront</span>
<span class="font-label-md text-label-md text-primary text-center">Retiro en Tienda</span>
<span class="font-caption text-caption text-on-surface-variant mt-1">Gratis</span>
</label>
<!-- Option 2: Delivery (Unselected) -->
<label class="relative flex flex-col items-center p-4 rounded-lg border border-outline-variant/50 hover:bg-surface-container-low cursor-pointer transition-all">
<input class="sr-only" name="delivery" type="radio" value="delivery"/>
<span class="material-symbols-outlined text-on-surface-variant mb-2" data-icon="local_shipping">local_shipping</span>
<span class="font-label-md text-label-md text-on-surface-variant text-center">Envío a Domicilio</span>
<span class="font-caption text-caption text-on-surface-variant mt-1">+$500</span>
</label>
</div>
</section>
<!-- Contact Information -->
<section class="flex flex-col gap-4">
<h3 class="font-label-md text-label-md text-on-surface uppercase tracking-widest mb-1">Tus Datos</h3>
<div>
<label class="sr-only" for="name">Nombre Completo</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 pb-2 px-0 focus:ring-0 focus:border-secondary-fixed-dim font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors" id="name" placeholder="Nombre Completo" type="text"/>
</div>
<div class="mt-2">
<label class="sr-only" for="phone">Teléfono</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 pb-2 px-0 focus:ring-0 focus:border-secondary-fixed-dim font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors" id="phone" placeholder="Teléfono" type="tel"/>
</div>
</section>
<!-- Total Calculation -->
<section class="bg-surface-container-low p-5 rounded-lg flex flex-col gap-2 mt-4">
<div class="flex justify-between font-caption text-caption text-on-surface-variant">
<span>Subtotal</span>
<span>$4.700</span>
</div>
<div class="flex justify-between font-caption text-caption text-on-surface-variant pb-2 border-b border-outline-variant/20">
<span>Retiro en Tienda</span>
<span>$0</span>
</div>
<div class="flex justify-between font-body-lg text-body-lg text-primary font-medium pt-2">
<span>Total</span>
<span>$4.700</span>
</div>
</section>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant/20 p-4 pb-6 z-40 md:static md:bg-transparent md:border-none md:p-0 md:max-w-md md:mx-auto md:mb-10">
<button class="w-full bg-primary-container text-on-primary py-4 px-8 rounded-full font-label-md text-label-md uppercase tracking-widest hover:bg-primary transition-colors shadow-[0_8px_16px_rgb(74,55,40,0.15)] active:scale-[0.98]">
            Confirmar Pedido
        </button>
</div>
<!-- Note: Suppressed NavigationDrawer and Footer as this is a focused transactional checkout flow per the Semantic Shell Mandate -->
<script>
        // Simple script to handle delivery method styling changes
        const deliveryRadios = document.querySelectorAll('input[name="delivery"]');
        
        deliveryRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all labels
                document.querySelectorAll('input[name="delivery"]').forEach(r => {
                    const label = r.closest('label');
                    label.classList.remove('border-2', 'border-secondary-fixed-dim', 'bg-secondary-fixed-dim/10');
                    label.classList.add('border', 'border-outline-variant/50');
                    
                    const icon = label.querySelector('.material-symbols-outlined');
                    const text = label.querySelector('.text-label-md');
                    
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-on-surface-variant');
                    
                    text.classList.remove('text-primary');
                    text.classList.add('text-on-surface-variant');
                });
                
                // Style selected label
                if(this.checked) {
                    const label = this.closest('label');
                    label.classList.remove('border', 'border-outline-variant/50');
                    label.classList.add('border-2', 'border-secondary-fixed-dim', 'bg-secondary-fixed-dim/10');
                    
                    const icon = label.querySelector('.material-symbols-outlined');
                    const text = label.querySelector('.text-label-md');
                    
                    icon.classList.remove('text-on-surface-variant');
                    icon.classList.add('text-primary');
                    
                    text.classList.remove('text-on-surface-variant');
                    text.classList.add('text-primary');
                }
            });
        });
    </script>
</body></html>
