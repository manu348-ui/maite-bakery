<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- TopAppBar Shell (Suppressed Nav Actions for Transactional Screen, kept Brand) -->
<header class="fixed top-0 w-full z-50 bg-surface flex justify-center items-center h-16 px-sm flat no shadows border-b border-surface-container-low">
<h1 class="font-headline-md text-headline-md uppercase tracking-widest text-primary">MAITÉ</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-5 pt-24 pb-12 w-full max-w-md mx-auto">
<!-- Hero Image / Brand Vis -->
<div class="mb-8 w-24 h-24 rounded-full overflow-hidden bg-surface-container-high flex items-center justify-center shadow-lg shadow-[#4A3728]/[0.05] border border-outline-variant/20">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
</div>
<div class="text-center mb-10 w-full space-y-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Acceso Administrativo</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Exclusivo para el equipo de Maité Bakery.
            </p>
<div class="bg-secondary-container/20 border border-secondary-fixed-dim/30 rounded-lg p-sm mt-md flex items-start gap-3 text-left">
<span class="material-symbols-outlined text-secondary-fixed-dim mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-caption text-caption text-on-surface-variant">
<span class="font-bold text-on-surface">Atención:</span> Acceso Administrativo Exclusivo - Los clientes no necesitan iniciar sesión para comprar.
                </p>
</div>
</div>
<!-- Login Form Area -->
<div class="w-full space-y-6">
<form action="#" class="space-y-4" method="POST">
<div class="relative">
<label class="sr-only" for="email">Correo Electrónico</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-secondary-fixed-dim focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-colors" id="email" name="email" placeholder="Correo electrónico institucional" type="email"/>
</div>
<div class="relative">
<label class="sr-only" for="password">Contraseña</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-secondary-fixed-dim focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-colors" id="password" name="password" placeholder="Contraseña" type="password"/>
</div>
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary py-4 px-8 rounded-full font-label-md text-label-md uppercase tracking-wider hover:bg-primary transition-colors shadow-lg shadow-[#4A3728]/[0.08]" type="submit">
                        Ingresar al Sistema
                    </button>
</div>
</form>
<div class="flex items-center w-full my-6">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="px-3 font-caption text-caption text-on-surface-variant uppercase tracking-widest">o</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- SSO Google -->
<button class="w-full flex items-center justify-center gap-3 bg-surface border border-outline-variant/50 text-on-surface py-4 px-8 rounded-full font-label-md text-label-md hover:bg-surface-container-low transition-colors shadow-sm">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continuar con Google
            </button>
<div class="text-center mt-8">
<a class="font-caption text-caption text-on-surface-variant hover:text-primary underline underline-offset-4 decoration-outline-variant/50 transition-colors" href="#">
                    ¿Olvidó su contraseña administrativa?
                </a>
</div>
