<script>
    // Micro-interaction for the password field
    const passwordInput = document.getElementById('password');
    const form = document.querySelector('form');

    form.addEventListener('submit', (e) => {
      // Basic aesthetic feedback for the "Success" feel without actual backend
      const btn = form.querySelector('button');
      const originalText = btn.innerText;
      
      if(passwordInput.value.length > 0) {
        e.preventDefault();
        btn.innerText = 'VERIFICANDO...';
        btn.disabled = true;
        btn.style.opacity = '0.7';
        
        setTimeout(() => {
          btn.innerText = 'ACCESO CONCEDIDO';
          btn.classList.remove('bg-primary-container');
          btn.classList.add('bg-secondary');
          
          // Mimic redirection
          setTimeout(() => {
            window.location.href = '#admin-dashboard';
            btn.innerText = originalText;
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.classList.add('bg-primary-container');
            btn.classList.remove('bg-secondary');
          }, 1000);
        }, 1500);
      }
    });
  </script>
<script>
function decodeJwtResponse(token) {
  let base64Url = token.split('.')[1];
  let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  return JSON.parse(jsonPayload);
}

function handleCredentialResponse(response) {
  const responsePayload = decodeJwtResponse(response.credential);
  const errorDiv = document.getElementById('login-error');
  
  if (responsePayload.email === 'manu348@gmail.com') {
    window.location.href = 'admin.html';
  } else {
    errorDiv.innerText = 'Acceso no autorizado para esta cuenta (' + responsePayload.email + ')';
    errorDiv.classList.remove('hidden');
  }
}
</script></body></html>
